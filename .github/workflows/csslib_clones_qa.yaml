name: csslib clone integration QA
on:
  push:
    branches:
      - palmoni5/csslib-clones-qa-20261110
    paths:
      - 'pkgs/csslib/**'
      - '.github/workflows/csslib_clones_qa.yaml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: pkgs/csslib
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - name: Get dependencies
        run: dart pub get
      - name: Show formatter diff for QA
        shell: bash
        run: |
          dart format .
          git diff --exit-code -- .
      - name: Static analysis
        run: dart analyze --fatal-infos
      - name: Run VM regression suite
        run: dart test --platform vm --reporter expanded
