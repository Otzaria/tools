name: package:html
permissions:
  contents: read

on:
  # Run on PRs and pushes to the default branch.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/html.yaml'
      - 'pkgs/html/**'
      - 'third_party/wpt-selectors/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/html.yaml'
      - 'pkgs/html/**'
      - 'third_party/wpt-selectors/**'
  schedule:
    - cron: "0 0 * * 0"
  # Allow manual verification when the fork's Actions queue is backlogged.
  workflow_dispatch:

defaults:
  run:
    working-directory: pkgs/html/

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: steps.install.outcome == 'success'
      - run: dart analyze --fatal-infos
        if: steps.install.outcome == 'success'

  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, sdk: '3.6' }
          - { os: ubuntu-latest, sdk: stable }
          - { os: ubuntu-latest, sdk: dev }
          # Otzaria is a Windows desktop app; catch filesystem and Chrome
          # differences in the HTML importer on Windows as well.
          - { os: windows-latest, sdk: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        run: dart pub get
      - run: dart test --platform vm
        if: steps.install.outcome == 'success'
      - run: dart test --platform chrome
        if: steps.install.outcome == 'success'
